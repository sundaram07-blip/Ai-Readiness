<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIAssess - AI Readiness Assessment Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #004ac6;
            --primary-dark: #003ea8;
            --secondary: #632ecd;
            --text-dark: #141b2b;
            --text-muted: #434655;
            --bg-light: #f9f9ff;
            --bg-white: #ffffff;
            --border-light: #c3c6d7;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background: linear-gradient(90deg, var(--bg-light) 0%, var(--bg-light) 100%), 
                        linear-gradient(90deg, var(--bg-white) 0%, var(--bg-white) 100%);
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(249, 249, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(195, 198, 215, 0.3);
            box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .nav-logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.24px;
        }

        .nav-menu-btn {
            background: none;
            border: none;
            width: 34px;
            height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .nav-menu-btn svg {
            width: 18px;
            height: 12px;
            stroke: var(--text-dark);
            stroke-width: 2;
        }

        @media (min-width: 768px) {
            .nav-menu-btn {
                display: none;
            }
        }

        .hero {
            padding-top: 140px;
            padding-bottom: 80px;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 64px;
        }

        .hero-content {
            padding: 0 16px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #e1e8fd;
            border-radius: 9999px;
            padding: 4px 12px;
            margin-bottom: 24px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.48px;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 24px;
            color: var(--text-dark);
        }

        .hero-title .highlight {
            color: var(--primary);
        }

        .hero-description {
            font-size: 18px;
            line-height: 1.56;
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 512px;
        }

        .hero-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 0.28px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.05);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0px 4px 12px rgba(0, 74, 198, 0.3);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-dark);
            border: 1px solid var(--border-light);
            box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.05);
        }

        .btn-secondary:hover {
            background: var(--bg-white);
            border-color: var(--primary);
        }

        .hero-preview {
            position: relative;
            padding: 0 16px;
        }

        .preview-blur {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 300px;
            background: linear-gradient(29.3deg, rgba(0, 74, 198, 0.1) 0%, rgba(99, 46, 205, 0.1) 100%);
            border-radius: 16px;
            filter: blur(20px);
            z-index: 0;
        }

        .preview-image {
            position: relative;
            z-index: 1;
            border: 1px solid rgba(195, 198, 215, 0.5);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0px 10px 15px -3px rgba(0, 0, 0, 0.1),
                        0px 4px 6px -4px rgba(0, 0, 0, 0.1);
            width: 100%;
            aspect-ratio: 358 / 200.86;
        }

        .preview-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            .hero-title {
                font-size: 48px;
